data:
  raw_path: data/raw/sample_urls.csv
  crawled_path: data/raw/crawled_evidence.jsonl   # may be absent; content/combined configs are then skipped
  label_positive_is: phishing                     # 1 in the raw CSV means phishing; use "legitimate" for PhiUSIIL
  test_size: 0.2
  random_state: 42

training:
  metric: f1
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 12
      n_jobs: -1
      random_state: 42
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      n_jobs: -1
      random_state: 42

agent:
  sandbox_timeout_seconds: 20
  phishing_threshold: 0.65
  suspicious_threshold: 0.35

monitoring:
  psi_threshold: 0.2
  reference_sample_size: 500

evaluation:
  compute_cost_usd_per_ms: 0.000000017
  browser_cost_usd_per_analysis: 0.00004
  llm_cost_usd_per_analysis: 0.00025
