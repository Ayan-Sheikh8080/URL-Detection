name: MLOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Reproduce data, training, and RAG pipelines
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m dvc repro

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Node tests and lint
        run: |
          npm test -- --runInBand
          npm run lint

      - name: Build API image
        run: docker build -f Dockerfile.api -t phishing-url-analyzer-api:${{ github.sha }} .

      - name: Build browser sandbox image
        run: docker build -f Dockerfile.sandbox -t phishing-url-analyzer-sandbox:${{ github.sha }} .

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
      SANDBOX_ECR_REPOSITORY: ${{ vars.SANDBOX_ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names "$API_ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$API_ECR_REPOSITORY"
          aws ecr describe-repositories --repository-names "$SANDBOX_ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$SANDBOX_ECR_REPOSITORY"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:latest

      - name: Build and push browser sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.SANDBOX_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.SANDBOX_ECR_REPOSITORY }}:latest

      - name: Deploy ECS service
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
