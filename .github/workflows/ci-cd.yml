name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint
      
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ github.repository }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ github.repository }}:latest
      
      - name: Deploy to ECS
        if: github.ref == 'refs/heads/main'
        env:
          ECS_SERVICE: phishing-url-analyzer
          ECS_CLUSTER: phishing-cluster
          ECS_TASK_DEFINITION: phishing-task-definition.json
          DEPLOYMENT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install DVC
        run: pip install dvc[s3]
      
      - name: Run data validation
        run: python -m src.pipeline.validate_data