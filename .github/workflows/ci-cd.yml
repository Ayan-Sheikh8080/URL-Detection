
name: MLOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check DVC pipeline status
        run: python -m dvc status

      # Step 4: Security regression tests
      - name: Run prompt injection security tests
        run: |
          python -m pytest tests/python/test_prompt_injection_pages.py -q

      - name: Run existing feature and safety tests
        run: |
          python -m pytest tests/python/test_features_and_safety.py -q

      - name: Run complete Python test suite
        run: |
          python -m pytest -q -p no:cacheprovider

      - name: Run Node tests and lint
        run: |
          npm test -- --runInBand
          npm run lint

      - name: Build API image
        run: docker build -f Dockerfile.api -t phishing-url-analyzer-api:${{ github.sha }} .

      - name: Build browser sandbox image
        run: docker build -f Dockerfile.sandbox -t phishing-url-analyzer-sandbox:${{ github.sha }} .

  
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
      SANDBOX_ECR_REPOSITORY: ${{ vars.SANDBOX_ECR_REPOSITORY }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.API_ECR_REPOSITORY }}:latest

      - name: Build and push browser sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.SANDBOX_ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.SANDBOX_ECR_REPOSITORY }}:latest

      - name: Register updated ECS task definition
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          REGISTRY="${{ steps.ecr-login.outputs.registry }}"

          jq \
            --arg API_IMAGE "$REGISTRY/$API_ECR_REPOSITORY:$GITHUB_SHA" \
            --arg SANDBOX_IMAGE "$REGISTRY/$SANDBOX_ECR_REPOSITORY:$GITHUB_SHA" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
            | (.containerDefinitions[] | select(.name == "api").image) = $API_IMAGE
            | (.containerDefinitions[] | select(.name == "browser-sandbox").image) = $SANDBOX_IMAGE' \
            task-definition.json > task-definition-rendered.json

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_TASK_DEFINITION"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION"

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS deployment completed successfully."
