services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BROWSER_SANDBOX_URL: http://sandbox:8080
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BROWSER_TIMEOUT_MS: "8000"
    depends_on:
      sandbox:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    volumes:
      - screenshots:/app/data/screenshots
      - monitoring:/app/data/monitoring
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    expose:
      - "8080"
    environment:
      PORT: "8080"
      BROWSER_TIMEOUT_MS: "8000"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    shm_size: 512m
    volumes:
      - screenshots:/app/data/screenshots
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  screenshots:
  monitoring:
  mlflow-data:
