# Local end-to-end stack: API + browser sandbox.
# The sandbox has no mounted folders, no credentials, dropped capabilities and
# resource limits. Page requests to private/internal hosts are blocked in code
# (src/agent/browser_sandbox.py).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TIMEOUT_SECONDS: "30"
      LLM_PROVIDER: ${LLM_PROVIDER:-rule_based}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
      - events:/app/data/monitoring
    networks:
      - backend
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      SANDBOX_TIMEOUT_SECONDS: "30"
      BLOCK_PRIVATE_NETWORKS: "true"
      BROWSER_HEADLESS: "true"
    # Bound resource limits: a hostile page must not exhaust the host.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  events:

networks:
  backend:
    driver: bridge
    internal: false   # needs egress to the public web