version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
    depends_on:
      - sandbox
    volumes:
      - .:/app

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      - CHROMIUM_FLAGS=--no-sandbox --disable-dev-shm-usage
      - PORT=8080
    caps:
      - capability:
          - browserName: chrome
            version: ""
            alwaysMatch:
              maxInstances: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest-ubuntu-py3.11
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts-phishing
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data: