services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BROWSER_SANDBOX_URL: http://sandbox:8080
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_PROFILE: default
      AWS_SDK_LOAD_CONFIG: "1"
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      BEDROCK_MODEL_ID: au.anthropic.claude-haiku-4-5-20251001-v1:0
      BROWSER_TIMEOUT_MS: "8000"
    depends_on:
      sandbox:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    volumes:
      - screenshots:/app/data/screenshots
      - monitoring:/app/data/monitoring
      - "${AWS_CONFIG_DIR}:/aws:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      BROWSER_TIMEOUT_MS: "8000"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    shm_size: 512m
    volumes:
      - screenshots:/app/data/screenshots
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    restart: unless-stopped
volumes:
  screenshots:
  monitoring:
  mlflow-data:
  prometheus-data:
